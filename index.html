<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Meu site</title>
        <style>
            header{
                background-color: #480E0E;
                color: #C99DFF;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                border: 5px solid black;
                padding: 16px;

            }

            main{
                background-color: black;
                color: blueviolet;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                border: 5px solid black;
                padding: 16px;
                display: flex;
            }

            img{
                height: 80px;
                width: 80px;
            }
            .artigo-autor{
                font-weight: bold;
            }

        </style>
    </head>
    <body>
        <header>
            <h1>Tressalma</h1>
            <p>Damos-te boas vindas ao centro de ajuda psi</p>
        </header>

        <main>
            <img src="imagem-blog.webp" alt="">
            <div>
                <h2>Organização desde 2024</h2>
                <p>Este é o protótipo do futuro site da minha organização de atenção e cuidaados psicossociais em direito à vida.</p>
                <p class="artigo-autor"></p> por m. tressoldi</p>
                <button>🐴<span>0</span></button>
            </div>
         </main>
        
    </body>
    <script>
        const botao = document.querySelector("button");
        botao.addEventListener("click",botaoClicado);
        function botaoClicado() {
            console.log("fui clicado");
            let texto = botao.querySelector("span");
            texto.textContent++;

        }

    </script>
</html>
